name: Infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infrastructure-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install static-check dependencies
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: Parse configuration and verify security contracts
        run: python scripts/check_repository.py
      - name: Exercise gateway authentication and endpoint restrictions
        run: python scripts/test_gateway.py
      - name: Scan repository for secrets
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa # 0.75.0
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --volume "$PWD:/work:ro" "$TRIVY_IMAGE" fs \
            --scanners secret --exit-code 1 --skip-dirs /work/.git \
            --skip-dirs '**/.terraform' --disable-telemetry --skip-version-check /work
      - name: Report infrastructure security findings
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa # 0.75.0
        run: |
          # Report-only: KUBE-0002 is an explicitly documented remaining risk.
          # Do not hide it behind a blanket suppression or claim a clean security gate.
          for stack in vpc eks vllm llm-d; do
            docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
              --volume "$PWD/$stack:/work:ro" "$TRIVY_IMAGE" config \
              --skip-check-update --tf-exclude-downloaded-modules \
              --skip-dirs '**/.terraform' --tf-vars /work/terraform.tfvars \
              --disable-telemetry --skip-version-check --severity HIGH,CRITICAL /work
          done
      # No cloud credentials, Terraform execution, or pull_request_target.
      # Helm rendering is available locally via scripts/render_router.py.

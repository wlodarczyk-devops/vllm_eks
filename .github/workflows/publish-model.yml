name: Publish model release

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: Full 40-character commit of the configured Qwen model
        required: true
        type: string
        default: cdbee75f17c01a7cc42f958dc650907174af0554

permissions:
  contents: read

concurrency:
  group: publish-model
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # Set a larger/self-hosted Linux runner label if the default lacks 25 GiB free.
    runs-on: ${{ vars.MODEL_PUBLISH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      MODEL_BUCKET: ${{ vars.MODEL_BUCKET }}
      MODEL_PUBLISH_ROLE_ARN: ${{ vars.MODEL_PUBLISH_ROLE_ARN }}
      MODEL_REVISION: ${{ inputs.model_revision }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate configuration and disk space
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, shutil
          missing = [name for name in ('AWS_REGION', 'MODEL_BUCKET', 'MODEL_PUBLISH_ROLE_ARN') if not os.environ[name]]
          if missing:
              raise SystemExit('Configure repository Actions variables: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['MODEL_REVISION']):
              raise SystemExit('model_revision must be a complete lowercase commit hash')
          if shutil.disk_usage(os.environ['TMPDIR']).free < 25 * 1024**3:
              raise SystemExit('Model publishing requires 25 GiB free. Configure MODEL_PUBLISH_RUNNER with a suitable Linux runner label.')
          PY
          command -v aws
      - name: Install model publishing dependency
        run: python3 -m pip install -r models/requirements.txt
      - name: Authenticate with short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MODEL_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          role-session-name: model-publish-${{ github.run_id }}
          unset-current-credentials: true
      - name: Publish the model and record version/checksum
        run: python3 models/publish.py --region "$AWS_REGION" --bucket "$MODEL_BUCKET" --revision "$MODEL_REVISION"
      - name: Preserve release metadata for PR creation or recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: models/release.json
          if-no-files-found: error
          retention-days: 7

  release-pr:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-release
      - name: Open a release PR without AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FILE: ${{ runner.temp }}/model-release/release.json
        run: python3 models/open_release_pr.py --release "$RELEASE_FILE"
